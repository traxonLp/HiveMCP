# Two volumes, on purpose.
#
# The template pool and the artifact scratch space have opposite lifecycles: templates
# are written rarely by administrators and read on nearly every request, artifacts are
# written constantly and swept on a TTL. Separating them means the template pool survives
# clearing or resizing the artifact volume, backups can cover the small valuable one
# without the large disposable one, and a runaway render cannot fill the disk that holds
# the corporate designs.
#
#   kubectl apply -f deploy/k8s/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hivemcp-templates
  labels:
    app.kubernetes.io/name: hivemcp
    app.kubernetes.io/component: templates
spec:
  accessModes:
    # ReadWriteMany because every replica reads it, and any replica may serve the
    # administrator who uploads. With a single replica ReadWriteOnce is enough and works
    # on far more storage classes.
    - ReadWriteMany
  resources:
    requests:
      # A corporate template is a few hundred kilobytes. This is sized for hundreds of
      # them plus room to be wrong about that.
      storage: 1Gi
  # storageClassName: nfs-client   # must support RWX; set to match your cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hivemcp-data
  labels:
    app.kubernetes.io/name: hivemcp
    app.kubernetes.io/component: artifacts
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # Rendered documents awaiting download, swept after HIVE_TMP_TTL_MINUTES.
      storage: 10Gi
  # storageClassName: nfs-client
# Both volumes are consumed by 02-deployment.yaml, which sets fsGroup 10001 to match the
# image's uid so neither needs root to be writable.
