[project]
name = "hivemcp"
version = "1.0.0"
description = "MCP + OpenAPI server for PowerPoint, Word and Excel generation in OpenWebUI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Upper bound is deliberate. v2.0.0 (2026-07-28) renamed FastMCP to MCPServer and
    # moved the module, so an unbounded ">=1.9" silently pulled in a breaking major and
    # the container failed at import. Bump this on purpose, never by accident.
    "mcp>=2.0,<3",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
hivemcp = "hivemcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hivemcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:hivemcp.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
